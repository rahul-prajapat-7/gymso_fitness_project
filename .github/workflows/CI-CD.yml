name: Static Website CI/CD Pipeline 
on:
  push:
    branches:
      - main

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
     - name: checkout code
       uses: actions/checkout@v4

     - name: login to docker hub
       uses: docker/login-action@v3
       with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

     - name: Debug
       run: |
        pwd
        ls -la
        echo "Username=${{ secrets.DOCKER_USERNAME }}"

     - name: Build Docker Image
       run: |
        docker build -t "${{ secrets.DOCKER_USERNAME }}/static-site:latest" .




    #  - name: Build Docker Image
    #    run: |
    #       docker build  -d -t ${{ secrets.DOCKER_USERNAME }}/static-site:latest .

     - name: push docker image 
       run: | 
          docker push ${{ secrets.DOCKER_USERNAME }}/static-site:latest




  deploy:
  runs-on: ubuntu-latest
  needs: build

  steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2 server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}

        # 🔥 IMPORTANT: Direct private key usage
        key: ${{ secrets.EC2_SSH_KEY }}

        # Optional but recommended (avoids host verification issues)
        script_stop: true

        script: |
          echo "Starting Deployment..."

          docker pull ${{ secrets.DOCKER_USERNAME }}/static-site:latest

          docker stop static-website || true
          docker rm static-website || true
          docker run -d -p 80:80 --name static-website \
            ${{ secrets.DOCKER_USERNAME }}/static-site:latest

          echo " Deployment Successful"