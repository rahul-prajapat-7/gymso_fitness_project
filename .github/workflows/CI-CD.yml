name: Static Website CI/CD Pipeline 
on:
  push:
    branches:
      - main

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
     - name: checkout code
       uses: actions/checkout@v4


     - name: login to docker hub
       uses: docker/login-action@v3
       with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


     - name: build and push docker image
       run: | 
          docker build -t ${{ secrets.DOCKER_USERNAME }}/static-website:latest .

     - name: push docker image 
       run: | 
          docker push ${{ secrets.DOCKER_USERNAME }}/static-website:latest


  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
     - name: Deploy to server
       uses: appleboy/ssh-action@v1.0.3
       with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}


          script: |
              docker pull ${{ secrets.DOCKER_USERNAME }}/static-site:latest
              docker stop static-website || true 
              docker rm static-website || true 

              docker run -d -p 80:80 --name static-website ${{ secrets.DOCKER_USERNAME }}/static-website:latest

              
