name: Static Website CI/CD Pipeline 
on:
  push:
    branches:
      - main

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
     - name: checkout code
       uses: actions/checkout@v4

     - name: login to docker hub
       uses: docker/login-action@v3
       with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

     - name: Debug
       run: |
        pwd
        ls -la
        echo "Username=${{ secrets.DOCKER_USERNAME }}"

     - name: Build Docker Image
       run: |
        docker build -t "${{ secrets.DOCKER_USERNAME }}/static-site:latest" .




    #  - name: Build Docker Image
    #    run: |
    #       docker build  -d -t ${{ secrets.DOCKER_USERNAME }}/static-site:latest .

     - name: push docker image 
       run: | 
          docker push ${{ secrets.DOCKER_USERNAME }}/static-site:latest




  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:

     - name: Checkout code
       uses: actions/checkout@v3

      # ✅ PLACE THIS HERE (VERY IMPORTANT)
     - name: Setup SSH key
       run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts



     - name: Deploy to server
       uses: appleboy/ssh-action@v1.0.3
       with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}


          script: |
              docker pull ${{ secrets.DOCKER_USERNAME }}/static-site:latest
              docker stop static-website || true 
              docker rm static-website || true 

              docker run -d -p 80:80 --name static-website ${{ secrets.DOCKER_USERNAME }}/static-site:latest

